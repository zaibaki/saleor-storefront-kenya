version: "3"

services:
  saleor-storefront:
    container_name: saleor-storefront
    build:
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SALEOR_API_URL: ${NEXT_PUBLIC_SALEOR_API_URL}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL}
        NEXT_PUBLIC_DEFAULT_CHANNEL: ${NEXT_PUBLIC_DEFAULT_CHANNEL}
    restart: always
    environment:
      - HOSTNAME=0.0.0.0
      - REVALIDATE_SECRET=REPLACE_WITH_YOUR_OWN_RANDOM_SECRET
    ports:
      - 4000:3000
    networks:
      - saleor_network
      - saleor-backend-tier

networks:
  saleor_network:
    external: false
  saleor-backend-tier:
    external: true
    name: saleor-platform_saleor-backend-tier
